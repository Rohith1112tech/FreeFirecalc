[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Redirect all traffic from the Netlify subdomain to the custom domain
[[redirects]]
  from = "https://freefirecalc.netlify.app/*"
  to = "https://tournament.jacksparrowesports.site/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/oauth2callback"
  to = "/index.html"
  status = 200
